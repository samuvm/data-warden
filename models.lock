# CAMBIO DE GENERADOR · 2026-09-10, con P-011 resuelta.
#
# El generador pasa de `qwen3.5:9b-mlx` a `gemma4:26b-mlx`. No es una preferencia: es lo
# medido. Con el 9B, `G-EXEC-ACC` da 0,193 (11/57), y sus 46 fallos son 12 `R004` —se
# inventa tabla o columna— y 12 `cell_value` —el número no sale—. Con el 26B, el mismo
# banco y el mismo sistema dan 0,421 (24/57). Lo que ataba el número era la capacidad del
# modelo para aterrizar en el esquema, y por eso se sube el modelo y no el umbral.
#
# El 9B se queda anotado abajo como `generador_anterior`: los números publicados antes de
# hoy son suyos, y un digest retirado del fichero volvería irreproducibles los informes
# que ya existen.
