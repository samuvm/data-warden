# `eval_toolchoice.py`, que mide si un cliente elige bien la herramienta con las
# descripciones publicadas, y no puntúa ni una sola salida del generador. `G-EXEC-ACC` no
# tiene juez: compara resultsets, que es determinista. Si algún día un juez llegara a
# puntuar texto del generador, esto habría que separarlo por familia y no solo por peso.

