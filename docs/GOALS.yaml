    umbral:
      operador: ">="
      valor: 0.80
      unidad: ratio
      adicionales:
        - etiqueta: "límite inferior del intervalo de Wilson 95 %"
          operador: ">="
          valor: 0.68
        - etiqueta: "tamaño del conjunto de referencia"
          operador: ">="
          valor: 60
    comando: "make eval"
    artefacto: "evals/reports/exec-accuracy.json"
    bloqueante_desde_fase: 8
    tipo: nucleo
    requiere: [dataset, horas-humanas]
    propuesta_admisible: true
    nota: >-
      REDEFINIDA en tres puntos. (1) 100 preguntas -> 60 estratificadas: a 10-20
      min por pregunta, 100 son 17-33 h humanas no delegables sobre un
      presupuesto total de 154-214 h; con 60 son 10-20 h (Q-010) y el intervalo
      apenas empeora. (2) Se publica el intervalo de Wilson, no el punto: con
      48/60, IC95 ~ [0,68-0,88]; publicar "0,80" a secas con n=60 es publicar un
      número sin significado. (3) La comparación es de resultsets normalizados
      según docs/spec/resultset-equality.md, nunca de texto SQL.

