# =============================================================================
# Presupuestos por rol · contrato propio, separado de la matriz de columnas
#
# Nace del cambio C-7 de la política firmada. `presupuesto_gb` y `limite_filas`
# vivían dentro de `docs/spec/policy.yaml`, junto a la matriz rol × columna. Son dos
# contratos con dos ritmos de cambio distintos:
#
#   · la matriz la firma negocio y no se toca;
#   · los presupuestos se recalibran con medidas (`make cost-calibration`).
#
# Mezclarlos significaba que cada recalibración tocaba un fichero firmado, y un
# fichero firmado que se toca cada semana deja de estar firmado.
#
# Qué está firmado y qué no, dicho explícitamente porque son cosas distintas:
#   · `hard_gb` y `max_rows` se firmaron junto con la política, con estas palabras:
#     "ops 0,05 GB / 2.000 filas es agresivo y correcto: ops mira un pago concreto;
#     si necesita más, es que está haciendo análisis y ese no es su rol".
#   · `soft_gb` no está firmado. Es una propuesta técnica pendiente de calibrar. Va
#     marcado `origen_soft: agente_por_calibrar` en cada fila para que nadie lo
#     publique como si fuera una decisión de negocio; el compilador lo lee y lo
#     publica como `soft_is_calibrated: false`.
# =============================================================================

version: 1
estado: FIRMADO           # los `hard_gb` y `max_rows`; ver `soft_gb` abajo
firmado_por: Samuel
firmado_el: 2026-09-01    # cambio C-7 de la política
extraido_de: docs/spec/policy.yaml
extraido_el: 2026-09-02

# -----------------------------------------------------------------------------
# Los tres números y qué hace cada uno. Son tres decisiones distintas y llamarlos
# «el presupuesto» a los tres es como se acaba con un solo número que no sirve
# para ninguna de las tres cosas.
# -----------------------------------------------------------------------------
significado:
  soft_gb: >-
    Por encima de esto la consulta no se rechaza: se pide confirmación. Por MCP es
    un `InputRequiredResult` de MRTR si el cliente declara que sabe confirmar; si
    no, se ejecuta con un aviso en el resultado. Existe porque un guardián que solo
    sabe decir «no» se desactiva.
  hard_gb: >-
    Por encima de esto la consulta no se ejecuta. Es el número que hace verdadera
    la meta `G-BUDGET-ESCAPE`, que es un axioma: cero consultas por encima del
    presupuesto llegan al motor. No se negocia en caliente.
  max_rows: >-
    Tope de filas devueltas, aplicado por el dominio y nunca por el motor (I-12).
    Un engine que aplicara su propio `LIMIT` haría que el número dependiera del
    motor, y entonces DuckDB y Athena darían resultados distintos con el mismo rol.

# -----------------------------------------------------------------------------
# Cómo se comparan estos gigabytes con lo que mide el estimador, porque si no se
# dice aquí, cada componente lo entiende de una manera.
# -----------------------------------------------------------------------------
unidad:
  que_se_mide: bytes_escaneados_estimados
  como: >-
    Suma de los bytes de las columnas proyectadas en los ficheros que sobreviven a
    la poda de particiones, leída de los metadatos de Iceberg. Nunca con
    `EXPLAIN ANALYZE`, que ejecuta la consulta y por tanto es inútil para un
    guardián preventivo (docs/RULES.md §7, error 11).
  base: 1000000000        # GB decimal, no GiB. Se declara para que no se discuta

roles:
  analyst:
    soft_gb: 0.30
    hard_gb: 0.60
    max_rows: 50000
    origen_soft: agente_por_calibrar
    justificacion: >-
      Construye el informe semanal sobre agregados. 0,60 GB da para escanear una
      partición ancha de `fact_payment_attempt` con pocas columnas, que es
      exactamente su trabajo, y no da para un `SELECT *` sin poda.

  ops:
    soft_gb: 0.02
    hard_gb: 0.05
    max_rows: 2000
    origen_soft: agente_por_calibrar
    justificacion: >-
      Firmado con estas palabras: «es agresivo y correcto: ops mira un pago
      concreto; si necesita más, es que está haciendo análisis y ese no es su
      rol». El límite bajo no es una restricción de confianza, es la forma de que
      el sistema empuje a ops hacia la consulta con predicado que le corresponde.

  finance:
    soft_gb: 0.40
    hard_gb: 0.80
    max_rows: 100000
    origen_soft: agente_por_calibrar
    justificacion: >-
      Cuadra lotes de liquidación, que es la tabla mediana del almacén, y a veces
      contra un trimestre entero. Ve más dinero y menos persona que ops.

  admin:
    soft_gb: 0.75
    hard_gb: 1.50
    max_rows: 250000
    origen_soft: agente_por_calibrar
    justificacion: >-
      Atiende un derecho de acceso o un requerimiento judicial: consulta poco y
      cuando consulta necesita el expediente entero. El control sobre este rol no
      es el presupuesto ni la máscara, es el no repudio de la auditoría encadenada.

# -----------------------------------------------------------------------------
# Lo que este contrato no dice, declarado en vez de descubierto
# -----------------------------------------------------------------------------
limites_declarados:
  - limite: El presupuesto es por consulta, no por sesión ni por día
    descripcion: >-
      Cien consultas de 0,59 GB seguidas pasan el guardián una a una. Un
      presupuesto acumulado exigiría estado por principal, y el protocolo MCP
      2026-07-28 no tiene sesiones: el estado tendría que vivir en el servidor y
      atarse a un `PrincipalToken`. Es trabajo real, no un parámetro.
    fuera_de_alcance_hoy: true
    regla_candidata: >-
      Ventana deslizante por `principal_id` sobre la propia cadena de auditoría,
      que ya registra los bytes de cada invocación. Barata de construir sobre la
      auditoría encadenada, y mientras no exista no se finge que existe.

  - limite: "`soft_gb` no está calibrado"
    descripcion: >-
      Es la mitad del duro, elegido a ojo y no por medida. `make cost-calibration`
      mide el error del estimador, no el coste típico de las consultas legítimas de
      cada rol, así que el número sigue siendo una hipótesis con forma de contrato.
    fuera_de_alcance_hoy: true
    regla_candidata: >-
      Fijar `soft_gb` en el p50 del coste real de las consultas legítimas de cada
      rol, que es lo que hace que el aviso salte cuando algo es raro y no cuando
      alguien hace su trabajo.
