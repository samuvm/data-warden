  - {id: C-10, rol: analyst, sql: "SELECT auth_status, count(*) AS n FROM fact_payment_attempt WHERE event_date >= DATE '2026-08-25' GROUP BY auth_status"}
  - {id: C-11, rol: analyst, sql: "SELECT auth_status FROM fact_payment_attempt WHERE event_date >= DATE '2026-08-01' AND event_date < DATE '2026-09-01'"}
  - {id: C-12, rol: finance, sql: "SELECT sum(fee_minor) AS f FROM fact_payment_attempt WHERE event_date >= DATE '2026-08-01'"}
  - {id: C-13, rol: analyst, sql: "SELECT geo_country, count(*) AS n FROM fact_payment_attempt WHERE event_date IN (DATE '2026-08-01', DATE '2026-08-15', DATE '2026-08-31') GROUP BY geo_country"}
  - {id: C-14, rol: analyst, sql: "SELECT auth_status, amount_eur_minor FROM fact_payment_attempt WHERE event_date > DATE '2026-08-20'"}
  - {id: C-15, rol: admin, sql: "SELECT count(*) AS n FROM fact_payment_attempt WHERE event_date <= DATE '2024-09-05'"}

