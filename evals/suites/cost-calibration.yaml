# =============================================================================
# Banco de calibración del estimador de coste · `G-COST-CALIB`
#
# Sesenta consultas contra `datagen/out/full`, como pide `docs/PLAN.md` en la
# fase 3. No son sesenta variaciones de la misma: la mitad del valor está en que el
# banco cubra los dos ejes donde el estimador puede equivocarse, que son los dos que
# separan un lakehouse de una base de datos de filas:
#
#   · **poda de PARTICIONES** — con predicado de fecha y sin él, un día, una semana,
#     un mes, un rango abierto, y predicados que el estimador NO sabe leer;
#   · **poda de COLUMNAS** — una columna, cinco, la tabla entera, y `count(*)`, que
#     no proyecta ninguna y aun así obliga a abrir los ficheros.
#
# Y las dos tablas grandes, las medianas y las de referencia, porque el error
# relativo de un estimador se ve en las pequeñas: sobre 4 GB, equivocarse en 10 MB
# no se nota; sobre 3 KB, es un factor de tres.
#
# La fecha de referencia del almacén es 2026-08-31 (`glossary.periodo`), y todos los
# literales de este banco se anclan a ella. Con `current_date` el banco caducaría
# solo, que es el bug con fecha de explosión que G-3 de la firma de Q-004 evita.
# =============================================================================

version: 1
escrito_por: agente
escrito_el: 2026-09-02
perfil: full
fecha_de_referencia: "2026-08-31"

consultas:
  # ------------------------------------------- un día, columnas estrechas y anchas
  - {id: C-01, rol: analyst, sql: "SELECT auth_status FROM fact_payment_attempt WHERE event_date = DATE '2026-08-31'"}
  - {id: C-02, rol: analyst, sql: "SELECT auth_status, amount_minor FROM fact_payment_attempt WHERE event_date = DATE '2026-08-31'"}
  - {id: C-03, rol: analyst, sql: "SELECT payment_intent_id, auth_status, amount_eur_minor, latency_ms, geo_country FROM fact_payment_attempt WHERE event_date = DATE '2026-08-30'"}
  - {id: C-04, rol: analyst, sql: "SELECT count(*) AS n FROM fact_payment_attempt WHERE event_date = DATE '2026-08-29'"}
  - {id: C-05, rol: analyst, sql: "SELECT auth_status, count(*) AS n FROM fact_payment_attempt WHERE event_date = DATE '2026-08-28' GROUP BY auth_status"}
  - {id: C-06, rol: finance, sql: "SELECT sum(amount_eur_minor) AS v FROM fact_payment_attempt WHERE event_date = DATE '2026-08-27'"}
  - {id: C-07, rol: ops, sql: "SELECT payment_intent_id, auth_status FROM fact_payment_attempt WHERE event_date = DATE '2026-08-26'"}
  - {id: C-08, rol: admin, sql: "SELECT ip_address_int, geo_country FROM fact_payment_attempt WHERE event_date = DATE '2026-08-25'"}

  # ------------------------------------------------------- una semana y un mes
