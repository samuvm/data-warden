  - id: Q-E-51
    pregunta: dame la tasa de reintento de cada canal, de mayor a menor
    rol: finance
    estrato: join_o_agregacion
    glosario: "metricas.tasa_de_reintento"
    arbitrio: false
    sustituye_a: "Q-E-22, retirada por Samuel el 2026-09-11 (Q-013)"
    por_que: >-
      **Sustituye a Q-E-22 en su MISMO estrato y con su mismo rol**, para que la
      estratificación de PLAN.md —20 simples, 25 con join o agregación, 15 con ventana—
      siga exacta. Transcribe `metricas.tasa_de_reintento`, que era la entrada firmada
      menos cubierta del banco (un solo caso, Q-E-06, y sin desglose). La fórmula firmada
      es `count(*)::DOUBLE / count(DISTINCT payment_intent_id) FROM v_attempt_dedup`;
      aquí se agrupa por `channel`. Sin la vista deduplicada, las reingestas cuentan
      como reintentos que nunca ocurrieron, que es exactamente la trampa del grano.
      Global medido 1,059, dentro de lo que el glosario declara (1,063).
    sql_referencia: >-
      SELECT channel, count(*)::DOUBLE / count(DISTINCT payment_intent_id) AS tasa_de_reintento
      FROM v_attempt_dedup GROUP BY channel ORDER BY tasa_de_reintento DESC
