    rol: analyst
    estrato: ventana_o_correlada
    glosario: null
    arbitrio: false
    por_que: >-
      `NOT EXISTS` correlacionado. Un `LEFT JOIN ... IS NULL` da lo mismo aquí, y las dos formas son correctas: el resultset normalizado es lo que decide, no la forma del SQL.
    sql_referencia: >-
      SELECT count(*) AS n FROM dim_merchant m WHERE m.is_current AND NOT EXISTS (SELECT 1 FROM fact_dispute d WHERE d.merchant_sk = m.merchant_sk)

  - id: Q-E-45
    pregunta: dame el volumen liquidado en euros de cada mes junto con la diferencia respecto al mes anterior, ordenado por mes
    rol: finance
    estrato: ventana_o_correlada
    glosario: "granos.lote_de_liquidacion"
    arbitrio: false
    por_que: >-
      `lag()`. La primera fila sale con `NULL` en la variación y eso es correcto: no hay mes anterior. Un modelo que lo rellene con cero está inventando un dato.
    sql_referencia: >-
      SELECT mes, volumen, volumen - lag(volumen) OVER (ORDER BY mes) AS variacion FROM (SELECT date_trunc('month', settlement_date) AS mes, sum(gross_eur_minor)/100.0 AS volumen FROM fact_settlement_batch GROUP BY mes) ORDER BY mes

