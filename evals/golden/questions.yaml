  - id: Q-E-21
    pregunta: cuál es nuestro comercio más importante
    rol: analyst
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.ingreso + granos.lote_de_liquidacion"
    arbitrio: false
    decidido_por: "Samuel, 2026-09-11 (Q-013): el que más ingreso bruto nos deja"
    por_que: >-
      **ERA ARBITRIO y lo ha resuelto Samuel: «importante para nosotros» es lo que nos
      deja, no lo que pasa por el tubo.** Se transcribe `ingreso_bruto` del glosario
      firmado —la comisión cobrada al comercio, `sum(fee_eur_minor)` sobre
      `fact_settlement_batch`— y no `volumen_procesado` ni `margen_neto`. Medido: gana
      Central Puerto con 5,03 M € y le saca un 34,9 % al segundo, así que la
      referencia no depende de un empate.
      **Aviso que no se esconde:** que «importante» signifique `ingreso_bruto` lo ha
      decidido Samuel, pero el glosario firmado todavía NO lo dice. Un modelo que solo
      lee el glosario tiene que adivinar la lectura entre cuatro, y la pregunta queda
      a propósito como la haría un directivo. Si falla, el fallo es de contexto y no de
      SQL; se arregla llevando la decisión al glosario, no cambiando la pregunta.
    sql_referencia: >-
      SELECT m.trade_name, sum(s.fee_eur_minor) / 100.0 AS ingreso_bruto
      FROM fact_settlement_batch AS s
      JOIN v_merchant_current AS m ON m.merchant_id = s.merchant_id
      GROUP BY s.merchant_id, m.trade_name
      ORDER BY ingreso_bruto DESC LIMIT 1

