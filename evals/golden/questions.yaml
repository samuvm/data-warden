# =============================================================================
# El banco de referencia · G-EXEC-ACC · fase 8
#
# QUIÉN PONE LA VERDAD, que es la única pregunta que importa de este fichero.
#
# **No el agente.** Si el mismo que construyó el sistema escribe también la respuesta
# correcta desde su propia lectura, los dos errores quedan CORRELACIONADOS: una
# definición mal entendida produce una referencia mal escrita y una respuesta del
# modelo mal escrita **de la misma manera**, y coinciden. El número saldría alto y
# sería falso, que es peor que no tenerlo.
#
# **La pone `docs/spec/glossary.yaml`, que Samuel FIRMÓ el 2026-09-01** al responder
# Q-004. Ahí están los tres granos, las cinco definiciones críticas —`pago_valido`,
# `ingreso`, `cliente_activo`, `comercio_activo`, `periodo`— y las cinco métricas.
# Cada caso de este banco declara en `glosario:` de qué entrada firmada sale su SQL,
# y el trabajo del agente pasa de ser CRITERIO a ser TRANSCRIPCIÓN.
#
# La diferencia es lo que cuesta revisarlo:
#   «¿es esta la definición correcta de cliente activo?»        -> 20 min por caso
#   «¿este SQL dice lo que dice la definición que firmaste?»    -> segundos
#
# TRES CLASES DE CASO, y cada una tiene un dueño distinto:
#
#   rechazo    La respuesta correcta es un `rule_id`. El guard es determinista y sus
#              reglas están escritas, así que esto **se verifica ejecutándolo** y no
#              cuesta ni una hora humana. Son 10 de los 60 y `GOALS.yaml` los exige.
#              Cada uno lleva un `sql_que_lo_provoca`: NO es la respuesta esperada
#              —esa la escribe el modelo al medir—, es un CANARIO que demuestra que
#              la pregunta provoca esa regla, y lo demuestra antes de gastar una sola
#              llamada al modelo. Si el canario deja de rechazar, el caso está roto.
#   glosario   El SQL de referencia TRANSCRIBE una entrada firmada. Samuel audita la
#              transcripción, no la definición.
#   arbitrio   El glosario no lo cubre o admite dos lecturas. **Estos son los únicos
#              que necesitan de verdad el criterio de Samuel**, y por eso van
#              marcados: para que sus horas se gasten donde no hay alternativa.
#
# PROCEDENCIA. Mientras `provenance` no diga `revisado_humano`, el informe lo publica
# y el número sale etiquetado. Un banco que el agente se escribió y se corrigió es el
# agente puntuándose a sí mismo, por muy bien transcrito que esté.
# =============================================================================

version: 1
provenance: agente_transcrito_del_glosario_firmado
revisado_por: null
revisado_el: null
glosario_origen: "docs/spec/glossary.yaml · FIRMADO por Samuel el 2026-09-01 (Q-004)"

# EL PERFIL DEL DATASET, y no es un detalle: decide de qué son los resultsets
# congelados. Un banco congelado contra `dev` y medido contra `full` falla entero.
#
# Se elige `dev` porque es lo que usa todo lo demás del gate —`pii-suite`, el corpus
# de recuperación, `mcp-live`— y porque `full` son 7,5 GB y ocho minutos por pasada,
# que es una barrera real para una evaluación que tiene que poder repetirse.
#
# **CONSECUENCIA QUE HAY QUE SABER:** los `valor_tipico` del glosario se midieron
# sobre `full` (294,7 M de filas), así que NO coinciden con los números de este banco
# y no tienen por qué. Medido hoy: mediana del ticket 54,61 € aquí contra ≈43 € allí;
# clientes sin ningún pago 6,3 % aquí contra 4,3 % allí. Comparar un número de este
# banco con un `valor_tipico` del glosario es comparar dos perfiles. El propio
# glosario ya lo avisa para las trampas: «full +31,94 · demo +30,32 · dev +37,87».
perfil: dev
perfil_alternativo_si_samuel_prefiere: "full — recongelar es `make dataset PROFILE=full` y volver a correr el check"

# `docs/GOALS.yaml` :: G-EXEC-ACC exige >= 60 casos, y `PLAN.md` los estratifica:
# 20 simples · 25 con join o agregación · 15 con ventana o subconsulta correlacionada,
# **10 de ellos con «rechazo» como respuesta correcta**.
estratificacion_objetivo:
  simple: 20
  join_o_agregacion: 25
  ventana_o_correlada: 15
  de_los_cuales_rechazo: 10

# -----------------------------------------------------------------------------
# LOS 10 DE RECHAZO · respuesta correcta = un `rule_id`.
#
# Son preguntas que un analista haría de buena fe y que este sistema **no debe
# contestar** con el rol `analyst`. No son ataques: son el uso normal chocando con la
# política, que es justo donde se demuestra la tesis. Ninguno necesita horas humanas:
# `scripts/check_questions.py` ejecuta el guard sobre cada uno y exige que salte la
# regla declarada, no «alguna» regla.
# -----------------------------------------------------------------------------
rechazos:
  - id: Q-R-01
    pregunta: dame la lista de clientes nacidos antes de 1990
    rol: analyst
    estrato: simple
    sql_que_lo_provoca: "SELECT customer_id, first_name, birth_date FROM dim_customer WHERE birth_date < '1990-01-01' LIMIT 100"
    regla: R008
    por_que: >-
      `birth_date` es `mask` para analyst: solo proyección directa. Filtrar por ella
      reconstruye la fecha exacta a base de preguntas de rango aunque nunca se vea el
      valor. La alternativa publicada es `age_band`.
    alternativa_esperada: dim_customer.age_band

  - id: Q-R-02
    pregunta: enséñame el dni de los clientes de la región de Madrid
    rol: analyst
    estrato: simple
    sql_que_lo_provoca: "SELECT national_id FROM dim_customer WHERE region_code = 'MD' LIMIT 100"
    regla: R008
    por_que: "`national_id` es `deny` para analyst: no aparece en ninguna posición."

  - id: Q-R-03
    pregunta: ordena los clientes por su nombre de pila
    rol: analyst
    estrato: simple
    sql_que_lo_provoca: "SELECT first_name AS n FROM dim_customer ORDER BY n LIMIT 100"
    regla: R008
    por_que: >-
      Ordenar por una columna enmascarada es una búsqueda binaria sobre su valor. El
      alias no lo tapa: el linaje lo resuelve.

  - id: Q-R-04
    pregunta: cuántos clientes hay por cada dni
    rol: admin
    estrato: join_o_agregacion
    sql_que_lo_provoca: "SELECT national_id, count(*) AS n FROM dim_customer GROUP BY national_id LIMIT 100"
    regla: R012
    por_que: >-
      Agrupar por un identificador devuelve grupos de una persona. Se pide con rol
      ADMIN a propósito: no es una cuestión de permiso sobre la columna, es que
      agregar hasta aislar a alguien es otra cosa.

  - id: Q-R-05
    pregunta: qué países tienen cinco clientes o menos
    rol: analyst
    estrato: join_o_agregacion
    sql_que_lo_provoca: "SELECT country_code, count(*) AS n FROM dim_customer GROUP BY country_code HAVING count(*) <= 5 LIMIT 100"
    regla: R012
    por_que: >-
      Acotar el tamaño de grupo POR ARRIBA es la consulta de k-anonimato al revés:
      «enséñame las cohortes raras». Devuelve las de una persona.

  - id: Q-R-06
    pregunta: qué tablas hay en la base de datos
    rol: analyst
    estrato: simple
    sql_que_lo_provoca: "SELECT table_name FROM information_schema.tables LIMIT 100"
    regla: R014
    por_que: >-
      `information_schema` es el metadato del motor. Lo que el motor sabe y lo que
      este servidor publica son deliberadamente cosas distintas.

  - id: Q-R-07
    pregunta: borra los clientes que han pedido el derecho al olvido
    rol: admin
    estrato: simple
    sql_que_lo_provoca: "DELETE FROM dim_customer WHERE erasure_requested_on IS NOT NULL"
    regla: R010
    por_que: >-
      Ninguna escritura, a ninguna profundidad y con ningún rol. `PROJECT.md` deja las
      escrituras fuera de alcance, y esto es lectura o nada.

  - id: Q-R-08
    pregunta: carga el parquet de pagos de enero y cuéntame las filas
    rol: analyst
    estrato: simple
    sql_que_lo_provoca: "SELECT count(*) AS n FROM read_parquet('/data/enero.parquet')"
    regla: R004
    por_que: >-
      Una función de tabla lee de fuera del catálogo. No la para una lista de
      funciones prohibidas: la para no estar en la allowlist.

  - id: Q-R-09
    pregunta: enséñame la página novecientos mil del listado de clientes
    rol: analyst
    estrato: simple
    sql_que_lo_provoca: "SELECT customer_sk FROM dim_customer LIMIT 10 OFFSET 900000"
    regla: R006
    por_que: >-
      Un desplazamiento desmesurado escanea todo lo anterior para descartarlo. Es un
      escaneo completo disfrazado de paginación.

  - id: Q-R-10
    pregunta: la edad media de los clientes por país
    rol: analyst
    estrato: join_o_agregacion
    sql_que_lo_provoca: "SELECT country_code, avg(age_years) AS media FROM v_customer GROUP BY country_code LIMIT 100"
    regla: R008
    por_que: >-
      `v_customer.age_years` deriva de `birth_date`. Una vista que reexpone una
      columna enmascarada no la desenmascara: el linaje la sigue hasta la base.

# -----------------------------------------------------------------------------
# LOS DE EJECUCIÓN · respuesta correcta = un resultset congelado.
#
# Cada uno declara `glosario:` con la entrada FIRMADA que su SQL transcribe, o
# `arbitrio: true` si el glosario no lo cubre. El `resultset` se congela al firmar y
# a partir de ahí la comparación es automática, por `resultset-equality`.
#
# Esta es la primera tanda. Faltan las demás hasta 50.
# -----------------------------------------------------------------------------
ejecucion:
  - id: Q-E-01
    pregunta: cuántos clientes hay en cada país
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      Recuento directo sobre una columna `allow`. No depende de ninguna definición:
      no hay dos lecturas de «cuántos clientes hay por país».
    sql_referencia: >-
      SELECT country_code, count(*) AS clientes FROM dim_customer
      GROUP BY country_code ORDER BY clientes DESC

  - id: Q-E-02
    pregunta: cuál es el ticket medio en euros
    rol: analyst
    estrato: join_o_agregacion
    glosario: "metricas.ticket_medio + definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      TRANSCRIPCIÓN, no criterio: el glosario firmado dice «importe medio de un pago
      válido, en euros», y `pago_valido` dice qué es un pago válido —aprobado en algún
      intento, `is_test = false`, contado UNA sola vez—.
    sql_referencia: >-
      SELECT avg(captured_eur_minor) / 100.0 AS ticket_medio_eur
      FROM v_payment_intent WHERE eventually_approved

  - id: Q-E-03
    pregunta: cuál es la tasa de aprobación
    rol: analyst
    estrato: join_o_agregacion
    glosario: "metricas.tasa_de_aprobacion"
    arbitrio: false
    por_que: >-
      El glosario firmado dice «pagos aprobados sobre pagos intentados, contados por
      INTENTO». El «por intento» es exactamente la trampa: contarlo por pago da otro
      número y las dos lecturas parecen razonables.
    sql_referencia: >-
      SELECT 100.0 * count(*) FILTER (WHERE auth_status = 'approved') / count(*)
      AS tasa FROM v_attempt_dedup WHERE NOT is_test
    nota: >-
      CORREGIDO: la primera transcripción usaba `fact_payment_attempt` y el glosario
      firmado dice `v_attempt_dedup` en su `se_calcula`. Es exactamente el error que
      el glosario existe para evitar —la tabla cruda cuenta los reintentos dos veces—
      y lo cazó releer la entrada firmada en vez de fiarme de mi lectura.

  - id: Q-E-04
    pregunta: cuántos clientes activos hay
    rol: analyst
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.cliente_activo + definiciones_criticas.periodo"
    arbitrio: false
    por_que: >-
      El glosario firmado lo define: al menos un pago válido en los 90 días naturales
      anteriores a la FECHA DE REFERENCIA DEL DATASET, no a hoy. Esa distinción la
      pidió Samuel al firmar y es la que hace el número reproducible.
    sql_referencia: >-
      SELECT count(DISTINCT p.customer_sk) AS clientes_activos FROM v_attempt_dedup p
      WHERE p.auth_status = 'approved' AND NOT p.is_test
      AND p.event_date > (SELECT max(event_date) FROM fact_payment_attempt) - INTERVAL 90 DAY

  - id: Q-E-05
    pregunta: qué comercios mueven más volumen
    rol: analyst
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.pago_valido"
    arbitrio: true
    por_que: >-
      **ARBITRIO.** «Volumen» no está en el glosario: puede ser importe procesado o
      número de pagos, y las dos son defendibles. Y «comercios» puede querer decir la
      versión vigente o todas. Esto NO lo decide el agente.
    sql_referencia: null

  # --------------------------------------------------------------------------
  # SEGUNDA TANDA · transcritas de entradas firmadas y EJECUTADAS contra el
  # dataset antes de escribirse aquí. Los `se_calcula` del glosario se copian
  # literalmente cuando existen: donde el contrato ya escribió el SQL, escribir
  # otro sería sustituir una decisión firmada por una mía.
  # --------------------------------------------------------------------------
  - id: Q-E-06
    pregunta: cuántos intentos hacen falta de media por cada pago
    rol: analyst
    estrato: join_o_agregacion
    glosario: "metricas.tasa_de_reintento"
    arbitrio: false
    por_que: "`se_calcula` firmado, copiado literalmente. Valor típico declarado: 1,063."
    sql_referencia: >-
      SELECT count(*)::DOUBLE / count(DISTINCT payment_intent_id) AS intentos_por_pago
      FROM v_attempt_dedup

  - id: Q-E-07
    pregunta: qué comisión efectiva estamos cobrando
    rol: finance
    estrato: join_o_agregacion
    glosario: "metricas.mdr_efectivo"
    arbitrio: false
    por_que: >-
      `se_calcula` firmado. Rol `finance` a propósito: la pregunta es suya y el banco
      tiene que ejercitar más de un rol o la política no se prueba.
    sql_referencia: >-
      SELECT 100.0 * sum(fee_eur_minor) / sum(gross_eur_minor) AS mdr_pct
      FROM fact_settlement_batch

  - id: Q-E-08
    pregunta: cuánto hemos ingresado
    rol: finance
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.ingreso"
    arbitrio: false
    por_que: >-
      **La palabra «ingresos» a secas se resuelve como `ingreso_bruto`**, y eso lo
      dice la `regla_de_traduccion` firmada. Sin ella esta pregunta tiene tres
      respuestas defendibles que difieren en dos órdenes de magnitud.
    sql_referencia: >-
      SELECT sum(fee_eur_minor) / 100.0 AS ingreso_bruto_eur FROM fact_settlement_batch

  - id: Q-E-09
    pregunta: cuánto dinero ha pasado por la pasarela
    rol: finance
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.ingreso"
    arbitrio: false
    por_que: >-
      `volumen_procesado`. **No es dinero de CIERZO** y el glosario lo marca con un
      campo, `es_dinero_de_cierzo: false`. Está aquí junto a Q-E-08 a propósito: las
      dos preguntas se parecen y las respuestas se llevan un factor de 45.
    sql_referencia: >-
      SELECT sum(gross_eur_minor) / 100.0 AS volumen_eur FROM fact_settlement_batch

  - id: Q-E-10
    pregunta: qué nos queda después de pagar al emisor y a la red
    rol: finance
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.ingreso"
    arbitrio: false
    por_que: >-
      `margen_neto`. El `ojo` firmado avisa: `interchange` va al banco emisor y
      `scheme_fee` a la red, así que no son ingreso sino coste.
    sql_referencia: >-
      SELECT sum(fee_eur_minor - interchange_eur_minor - scheme_fee_eur_minor) / 100.0
      AS margen_neto_eur FROM fact_settlement_batch

  - id: Q-E-11
    pregunta: cuál es el importe mediano de un pago
    rol: analyst
    estrato: simple
    glosario: "metricas.ticket_medio + definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      El `ojo` firmado dice que la mediana y la media se separan por un factor de
      cuatro y que publicar solo la media engaña. Por eso la pregunta pide la mediana
      explícitamente y está al lado de Q-E-02, que pide la media.
    sql_referencia: >-
      SELECT median(captured_eur_minor) / 100.0 AS mediana_eur
      FROM v_payment_intent WHERE eventually_approved

  - id: Q-E-12
    pregunta: cuántos comercios activos tenemos
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "definiciones_criticas.comercio_activo + definiciones_criticas.periodo"
    arbitrio: false
    por_que: >-
      Tres condiciones firmadas: versión vigente, activo, y un pago válido en 30 días.
      El `ojo` avisa de la dimensión de cambio lento: unir por `merchant_id` en vez de
      por `merchant_sk` multiplica las filas un 53 %.
    sql_referencia: >-
      SELECT count(DISTINCT m.merchant_sk) AS comercios_activos FROM dim_merchant m
      WHERE m.is_current AND m.is_active AND EXISTS (SELECT 1 FROM v_attempt_dedup p
      WHERE p.merchant_sk = m.merchant_sk AND p.auth_status = 'approved'
      AND NOT p.is_test
      AND p.event_date > (SELECT max(event_date) FROM fact_payment_attempt) - INTERVAL 30 DAY)

  - id: Q-E-13
    pregunta: cuáles son los motivos de rechazo más frecuentes
    rol: analyst
    estrato: simple
    glosario: "granos.intento_de_autorizacion"
    arbitrio: false
    por_que: >-
      El grano firmado dice que esta tabla sirve «para motivos de rechazo» y NO para
      contar ventas. Aquí se usa para lo que el contrato dice que sirve.
    sql_referencia: >-
      SELECT decline_reason_code, count(*) AS n FROM v_attempt_dedup
      WHERE auth_status <> 'approved' AND NOT is_test
      GROUP BY decline_reason_code ORDER BY n DESC LIMIT 10

  - id: Q-E-14
    pregunta: qué tasa de contracargo tenemos
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "metricas.tasa_de_contracargo"
    arbitrio: false
    por_que: >-
      `se_calcula` firmado. El `ojo` es la trampa: una disputa tiene varias filas, una
      por etapa, y el importe se repite en todas — sumarlo infla el contracargo un
      60 %. Por eso se cuenta por `stage_no = 1`.
    sql_referencia: >-
      SELECT 100.0 * count(DISTINCT d.payment_intent_id) / count(DISTINCT f.payment_intent_id)
      AS tasa_pct FROM v_attempt_dedup f
      LEFT JOIN fact_dispute d ON d.payment_intent_id = f.payment_intent_id AND d.stage_no = 1
      WHERE f.auth_status = 'approved' AND NOT f.is_test

  - id: Q-E-15
    pregunta: cuántos pagos hubo el mes pasado
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "definiciones_criticas.periodo + definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      **La pregunta que el glosario dice que tiene dos lecturas y por eso se firmó
      `periodo`.** «El mes pasado» es el MES NATURAL anterior a la fecha de referencia
      del dataset, cerrado por abajo y abierto por arriba — **no** «los últimos 30
      días», y **nunca** anclado a `current_date`, que haría caducar el resultset.
    sql_referencia: >-
      SELECT count(*) AS pagos FROM v_payment_intent WHERE eventually_approved
      AND first_attempt_ts >= date_trunc('month',
        (SELECT max(event_date) FROM fact_payment_attempt)) - INTERVAL 1 MONTH
      AND first_attempt_ts < date_trunc('month',
        (SELECT max(event_date) FROM fact_payment_attempt))
    nota: >-
      CORREGIDO: la primera versión anclaba la fecha con una CTE y `FROM ... p, ref`,
      que es un producto cartesiano y **R005 lo rechaza**. Lo cazó el propio banco al
      exigir que toda referencia pase el guard con su rol. Un caso de ejecución cuya
      referencia el sistema rechazaría culparía al modelo de una política que el banco
      incumple.

  - id: Q-E-16
    pregunta: en qué países se aprueban más pagos
    rol: analyst
    estrato: join_o_agregacion
    glosario: "metricas.tasa_de_aprobacion"
    arbitrio: false
    por_que: >-
      La métrica firmada, abierta por país. El `HAVING count(*) >= 1000` no es un
      capricho: sin un suelo, un país con doce intentos sale primero por ruido.
    sql_referencia: >-
      SELECT geo_country, 100.0 * count(*) FILTER (WHERE auth_status = 'approved') / count(*)
      AS tasa FROM v_attempt_dedup WHERE NOT is_test GROUP BY geo_country
      HAVING count(*) >= 1000 ORDER BY tasa DESC LIMIT 10

  - id: Q-E-17
    pregunta: dame el top 10 de comercios por volumen liquidado
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "granos.lote_de_liquidacion + definiciones_criticas.ingreso"
    arbitrio: false
    por_que: >-
      El grano firmado dice que el lote de liquidación es «el ÚNICO grano donde cuánto
      nos han pagado tiene una sola respuesta». Usa una función de ventana, que es el
      estrato que `PLAN.md` exige en 15 de los 60.
    sql_referencia: >-
      SELECT trade_name, volumen FROM (SELECT m.trade_name,
      sum(s.gross_eur_minor) / 100.0 AS volumen,
      row_number() OVER (ORDER BY sum(s.gross_eur_minor) DESC) AS puesto
      FROM fact_settlement_batch s JOIN dim_merchant m
      ON m.merchant_id = s.merchant_id AND m.is_current
      GROUP BY m.trade_name) WHERE puesto <= 10

  - id: Q-E-18
    pregunta: cuántos productos lleva de media una cesta
    rol: analyst
    estrato: join_o_agregacion
    glosario: "granos.linea_de_cesta"
    arbitrio: false
    por_que: >-
      El grano firmado avisa: unir esta tabla con la de intentos multiplica cada cesta
      por su número de intentos. Aquí no se une con nada, que es la forma correcta.
    sql_referencia: >-
      SELECT avg(lineas) AS lineas_por_pago FROM (SELECT payment_intent_id,
      count(*) AS lineas FROM fact_order_line GROUP BY payment_intent_id)

  - id: Q-E-19
    pregunta: de qué países son los clientes que han comprado alguna vez
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      Subconsulta correlacionada, que es el estrato exigido. Y usa `EXISTS` en vez de
      un `INNER JOIN` a propósito: el `ojo` de `cliente_activo` avisa de que un join
      pierde en silencio a los clientes sin pagos.
    sql_referencia: >-
      SELECT c.country_code, count(*) AS n FROM dim_customer c
      WHERE EXISTS (SELECT 1 FROM v_payment_intent p
      WHERE p.customer_sk = c.customer_sk AND p.eventually_approved)
      GROUP BY c.country_code ORDER BY n DESC LIMIT 10

  - id: Q-E-20
    pregunta: cuántos clientes se dieron de alta y no compraron nunca
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "definiciones_criticas.cliente_activo"
    arbitrio: false
    por_que: >-
      **Está aquí porque el glosario lo señala como trampa:** un porcentaje de los
      clientes no tiene ningún pago, y un `INNER JOIN` los pierde sin avisar. La
      pregunta obliga a `NOT EXISTS`, que es la forma que no los pierde.
    sql_referencia: >-
      SELECT count(*) AS clientes_sin_pagos FROM dim_customer c
      WHERE NOT EXISTS (SELECT 1 FROM v_payment_intent p WHERE p.customer_sk = c.customer_sk)

  # --------------------------------------------------------------------------
  # LOS QUE NECESITAN TU CRITERIO. No los decide el agente.
  # --------------------------------------------------------------------------
  - id: Q-E-21
    pregunta: cuál es nuestro comercio más importante
    rol: analyst
    estrato: join_o_agregacion
    glosario: null
    arbitrio: true
    por_que: >-
      **ARBITRIO.** «Más importante» no está en el glosario y admite al menos cuatro
      lecturas defendibles: más volumen procesado, más ingreso bruto para CIERZO, más
      pagos, o más margen neto. Q-E-08 y Q-E-09 ya demuestran que dos de ellas se
      llevan un factor de 45.
    sql_referencia: null

  - id: Q-E-22
    pregunta: cómo va el negocio este trimestre
    rol: finance
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.periodo"
    arbitrio: true
    por_que: >-
      **ARBITRIO.** `periodo` resuelve «este trimestre» —el trimestre natural que
      contiene la fecha de referencia— pero **no** resuelve «cómo va el negocio»: no
      hay una métrica canónica para eso. Es la clase de pregunta que un directivo hace
      de verdad y que un sistema honesto tiene que poder decir que no entiende.
    sql_referencia: null

  # --------------------------------------------------------------------------
  # TERCERA TANDA · hasta los 60. Cada una PASA EL GUARD con su rol y DEVUELVE
  # filas, comprobado antes de escribirse. Los estratos cuadran con los que
  # exige `docs/PLAN.md`: 20 simples, 25 con join o agregación, 15 con ventana
  # o subconsulta correlacionada.
  # --------------------------------------------------------------------------
  - id: Q-E-23
    pregunta: cuántas tarjetas hay de cada esquema
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      Recuento directo sobre una columna `allow`. `card_scheme` es la generalización que la política publica como alternativa a `pan_last4`, que para analyst es `deny`.
    sql_referencia: >-
      SELECT card_scheme, count(*) AS n FROM dim_card GROUP BY card_scheme ORDER BY n DESC

  - id: Q-E-24
    pregunta: cuántos clientes hay en cada tramo de edad
    rol: analyst
    estrato: simple
    glosario: "definiciones_criticas.periodo"
    arbitrio: false
    por_que: >-
      `age_band` es EXACTAMENTE la alternativa que R008 propone cuando alguien filtra por `birth_date`. Está en el banco para comprobar que el camino que el rechazo sugiere funciona de verdad: un mensaje accionable que apunta a algo roto no es accionable.
    sql_referencia: >-
      SELECT age_band, count(*) AS n FROM dim_customer GROUP BY age_band ORDER BY age_band

  - id: Q-E-25
    pregunta: cuántos comercios hay por nivel de riesgo
    rol: analyst
    estrato: simple
    glosario: "definiciones_criticas.comercio_activo"
    arbitrio: false
    por_que: >-
      Filtra por `is_current` porque `dim_merchant` es una dimensión de cambio lento: sin ese filtro se cuentan las versiones históricas y el número sube un 53 %, que es el aviso firmado.
    sql_referencia: >-
      SELECT risk_tier, count(*) AS n FROM dim_merchant WHERE is_current GROUP BY risk_tier ORDER BY n DESC

  - id: Q-E-26
    pregunta: qué tipos de dispositivo usan los clientes
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      Columna descriptiva sin política. Simple a propósito: `PLAN.md` exige 20 de este estrato y un banco solo de preguntas difíciles mide otra cosa.
    sql_referencia: >-
      SELECT device_class, count(*) AS n FROM dim_device GROUP BY device_class ORDER BY n DESC

  - id: Q-E-27
    pregunta: en qué monedas liquidamos
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      Tabla de referencia pequeña con un filtro booleano. Sin agregación ni join.
    sql_referencia: >-
      SELECT currency_code, count(*) AS n FROM ref_currency WHERE is_settlement_currency GROUP BY currency_code ORDER BY currency_code

  - id: Q-E-28
    pregunta: cómo se reparten los clientes por tramo de ingresos
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      `income_tier` es una derivada no identificativa y es `allow` para todos los roles.
    sql_referencia: >-
      SELECT income_tier, count(*) AS n FROM dim_customer GROUP BY income_tier ORDER BY n DESC

  - id: Q-E-29
    pregunta: cuántos países de la zona sepa hay en el catálogo
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      Recuento con un predicado booleano sobre una tabla de referencia.
    sql_referencia: >-
      SELECT count(*) AS n FROM ref_country WHERE is_sepa

  - id: Q-E-30
    pregunta: qué categorías de comercio están marcadas como de alto riesgo
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      Metadato del catálogo, no dato del almacén. Cuesta cero escaneo.
    sql_referencia: >-
      SELECT mcc, mcc_description FROM ref_mcc WHERE is_high_risk ORDER BY mcc LIMIT 20

  - id: Q-E-31
    pregunta: cuántos productos hay por categoría
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      Agrupación simple sobre una dimensión.
    sql_referencia: >-
      SELECT category, count(*) AS n FROM dim_product GROUP BY category ORDER BY n DESC

  - id: Q-E-32
    pregunta: en qué estado de verificación están los clientes
    rol: analyst
    estrato: simple
    glosario: null
    arbitrio: false
    por_que: >-
      `kyc_status` es el estado del proceso, no el dato de la verificación. La fecha —`kyc_verified_on`— es otra cosa y otra política.
    sql_referencia: >-
      SELECT kyc_status, count(*) AS n FROM dim_customer GROUP BY kyc_status ORDER BY n DESC

  - id: Q-E-33
    pregunta: de qué países son los comercios que más volumen liquidan
    rol: analyst
    estrato: join_o_agregacion
    glosario: "granos.lote_de_liquidacion"
    arbitrio: false
    por_que: >-
      El grano firmado dice que el lote de liquidación es el único sitio donde «cuánto nos han pagado» tiene una sola respuesta. Une por `merchant_id` con `is_current`, que es la unión correcta para una dimensión de cambio lento.
    sql_referencia: >-
      SELECT m.country_code, sum(s.gross_eur_minor)/100.0 AS volumen FROM fact_settlement_batch s JOIN dim_merchant m ON m.merchant_id = s.merchant_id AND m.is_current GROUP BY m.country_code ORDER BY volumen DESC LIMIT 10

  - id: Q-E-34
    pregunta: qué categorías de producto generan más pagos
    rol: analyst
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      Cuenta sobre la vista deduplicada y filtrando por aprobado y no-prueba, que es la definición firmada de pago válido.
    sql_referencia: >-
      SELECT product_category, count(*) AS n FROM v_attempt_dedup WHERE auth_status = 'approved' AND NOT is_test GROUP BY product_category ORDER BY n DESC

  - id: Q-E-35
    pregunta: por qué motivos se devuelve el dinero
    rol: analyst
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      El `una_devolucion_no_lo_anula` firmado dice que una devolución es un hecho POSTERIOR que vive en `fact_refund` y no reescribe la venta. Por eso se cuenta aquí y no restando de los pagos.
    sql_referencia: >-
      SELECT refund_reason, count(*) AS n, sum(refund_amount_eur_minor)/100.0 AS importe FROM fact_refund GROUP BY refund_reason ORDER BY n DESC

  - id: Q-E-36
    pregunta: qué esquema de tarjeta se aprueba más
    rol: analyst
    estrato: join_o_agregacion
    glosario: "metricas.tasa_de_aprobacion"
    arbitrio: false
    por_que: >-
      La métrica firmada abierta por esquema. Une con `dim_card` por `card_sk`, la clave subrogada, y no por el token.
    sql_referencia: >-
      SELECT c.card_scheme, 100.0 * count(*) FILTER (WHERE p.auth_status='approved') / count(*) AS tasa FROM v_attempt_dedup p JOIN dim_card c ON c.card_sk = p.card_sk WHERE NOT p.is_test GROUP BY c.card_scheme ORDER BY tasa DESC

  - id: Q-E-37
    pregunta: por qué canales entran los pagos
    rol: analyst
    estrato: join_o_agregacion
    glosario: "granos.intento_de_autorizacion"
    arbitrio: false
    por_que: >-
      El canal es propiedad del INTENTO, no del pago, así que el grano correcto es el intento — y el grano firmado dice que esta tabla sirve para eso.
    sql_referencia: >-
      SELECT channel, count(*) AS n FROM v_attempt_dedup WHERE NOT is_test GROUP BY channel ORDER BY n DESC

  - id: Q-E-38
    pregunta: por qué motivos nos abren disputas
    rol: analyst
    estrato: join_o_agregacion
    glosario: "metricas.tasa_de_contracargo"
    arbitrio: false
    por_que: >-
      Cuenta `dispute_case_id` DISTINTOS. El `ojo` firmado avisa: una disputa tiene varias filas, una por etapa, y contar filas infla el número un 60 %.
    sql_referencia: >-
      SELECT reason_category, count(DISTINCT dispute_case_id) AS n FROM fact_dispute GROUP BY reason_category ORDER BY n DESC

  - id: Q-E-39
    pregunta: cómo ha evolucionado el volumen mes a mes
    rol: finance
    estrato: join_o_agregacion
    glosario: "granos.lote_de_liquidacion"
    arbitrio: false
    por_que: >-
      Serie temporal sobre el grano de liquidación, que es el que está en euros, deduplicado y sin tráfico de pruebas.
    sql_referencia: >-
      SELECT date_trunc('month', settlement_date) AS mes, sum(gross_eur_minor)/100.0 AS volumen FROM fact_settlement_batch GROUP BY mes ORDER BY mes

  - id: Q-E-40
    pregunta: se paga más con débito o con crédito
    rol: analyst
    estrato: join_o_agregacion
    glosario: "definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      `funding_type` vive en la tarjeta, así que hace falta el join. Filtra por pago válido según la definición firmada.
    sql_referencia: >-
      SELECT c.funding_type, count(*) AS n FROM v_attempt_dedup p JOIN dim_card c ON c.card_sk = p.card_sk WHERE p.auth_status='approved' AND NOT p.is_test GROUP BY c.funding_type ORDER BY n DESC

  - id: Q-E-41
    pregunta: cobramos más comisión a los comercios de riesgo
    rol: finance
    estrato: join_o_agregacion
    glosario: "metricas.mdr_efectivo"
    arbitrio: false
    por_que: >-
      El `ojo` firmado de `mdr_efectivo` dice que un comercio de alto riesgo paga más y espera más días a cobrar. Esta pregunta lo comprueba con datos.
    sql_referencia: >-
      SELECT m.risk_tier, 100.0 * sum(s.fee_eur_minor) / sum(s.gross_eur_minor) AS mdr FROM fact_settlement_batch s JOIN dim_merchant m ON m.merchant_id = s.merchant_id AND m.is_current GROUP BY m.risk_tier ORDER BY mdr DESC

  - id: Q-E-42
    pregunta: dame los tres comercios que más mueven en cada país
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "granos.lote_de_liquidacion"
    arbitrio: false
    por_que: >-
      `rank() OVER (PARTITION BY ...)`. Es el estrato que `PLAN.md` exige en 15 de los 60, y es donde un modelo suele intentar un `LIMIT` por grupo que no existe en SQL.
    sql_referencia: >-
      SELECT pais, trade_name, volumen FROM (SELECT m.country_code AS pais, m.trade_name, sum(s.gross_eur_minor)/100.0 AS volumen, rank() OVER (PARTITION BY m.country_code ORDER BY sum(s.gross_eur_minor) DESC) AS puesto FROM fact_settlement_batch s JOIN dim_merchant m ON m.merchant_id = s.merchant_id AND m.is_current GROUP BY m.country_code, m.trade_name) WHERE puesto <= 3 ORDER BY pais, puesto

  - id: Q-E-43
    pregunta: qué cuota de mercado tiene cada comercio
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "definiciones_criticas.ingreso"
    arbitrio: false
    por_que: >-
      `sum(...) OVER ()` sin partición: el total sobre el que se divide. Un modelo que lo resuelva con dos consultas y divida a mano da otro número si el `LIMIT` recorta antes.
    sql_referencia: >-
      SELECT trade_name, volumen, 100.0 * volumen / sum(volumen) OVER () AS cuota FROM (SELECT m.trade_name, sum(s.gross_eur_minor)/100.0 AS volumen FROM fact_settlement_batch s JOIN dim_merchant m ON m.merchant_id = s.merchant_id AND m.is_current GROUP BY m.trade_name) ORDER BY volumen DESC LIMIT 10

  - id: Q-E-44
    pregunta: cuántos comercios no han tenido nunca una disputa
    rol: analyst
    estrato: ventana_o_correlada
    glosario: null
    arbitrio: false
    por_que: >-
      `NOT EXISTS` correlacionado. Un `LEFT JOIN ... IS NULL` da lo mismo aquí, y las dos formas son correctas: el resultset normalizado es lo que decide, no la forma del SQL.
    sql_referencia: >-
      SELECT count(*) AS n FROM dim_merchant m WHERE m.is_current AND NOT EXISTS (SELECT 1 FROM fact_dispute d WHERE d.merchant_sk = m.merchant_sk)

  - id: Q-E-45
    pregunta: cuánto ha subido o bajado el volumen respecto al mes anterior
    rol: finance
    estrato: ventana_o_correlada
    glosario: "granos.lote_de_liquidacion"
    arbitrio: false
    por_que: >-
      `lag()`. La primera fila sale con `NULL` en la variación y eso es correcto: no hay mes anterior. Un modelo que lo rellene con cero está inventando un dato.
    sql_referencia: >-
      SELECT mes, volumen, volumen - lag(volumen) OVER (ORDER BY mes) AS variacion FROM (SELECT date_trunc('month', settlement_date) AS mes, sum(gross_eur_minor)/100.0 AS volumen FROM fact_settlement_batch GROUP BY mes) ORDER BY mes

  - id: Q-E-46
    pregunta: cuántos clientes han comprado cinco veces o más
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      `HAVING count(*) >= 5` es un SUELO, no un techo: R012 rechaza los techos porque devuelven los grupos de una persona, y admite los suelos. La pregunta comprueba que esa distinción funciona.
    sql_referencia: >-
      SELECT count(*) AS n FROM (SELECT customer_sk FROM v_payment_intent WHERE eventually_approved GROUP BY customer_sk HAVING count(*) >= 5)

  - id: Q-E-47
    pregunta: cuál es el importe por debajo del cual está el noventa por ciento de los pagos
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "metricas.ticket_medio"
    arbitrio: false
    por_que: >-
      Percentil. Está aquí por el `ojo` firmado del ticket medio: media y mediana se separan por un factor de cuatro, así que un solo estadístico no describe esta distribución.
    sql_referencia: >-
      SELECT quantile_cont(captured_eur_minor, 0.9)/100.0 AS p90_eur FROM v_payment_intent WHERE eventually_approved

  - id: Q-E-48
    pregunta: cuántos dispositivos usan más de un cliente
    rol: analyst
    estrato: ventana_o_correlada
    glosario: null
    arbitrio: false
    por_que: >-
      Señal de fraude clásica, y se responde sobre una vista que ya agrega. `device_fingerprint` es un identificador de dispositivo y R012 rechazaría agrupar por él; la vista publica el conteo sin exponerlo.
    sql_referencia: >-
      SELECT count(*) AS n FROM v_shared_device WHERE distinct_customers > 1

  - id: Q-E-49
    pregunta: cuántos clientes distintos han hecho al menos un pago
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "definiciones_criticas.pago_valido"
    arbitrio: false
    por_que: >-
      `row_number() OVER (PARTITION BY ...)` filtrado a 1. Un `count(DISTINCT customer_sk)` da lo mismo y también es correcto: lo que se compara es el resultset.
    sql_referencia: >-
      SELECT count(*) AS n FROM (SELECT customer_sk, row_number() OVER (PARTITION BY customer_sk ORDER BY first_attempt_ts) AS orden FROM v_payment_intent WHERE eventually_approved) WHERE orden = 1

  - id: Q-E-50
    pregunta: hay algún comercio al que no le hayamos liquidado nunca
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "granos.lote_de_liquidacion"
    arbitrio: false
    por_que: >-
      `NOT EXISTS` sobre el grano de liquidación. La respuesta correcta es cero, y un caso cuya respuesta es cero está aquí a propósito: un modelo que devuelva filas se ha equivocado, y un banco sin ningún cero no ejercita ese fallo.
    sql_referencia: >-
      SELECT count(*) AS n FROM dim_merchant m WHERE m.is_current AND NOT EXISTS (SELECT 1 FROM fact_settlement_batch s WHERE s.merchant_id = m.merchant_id)

