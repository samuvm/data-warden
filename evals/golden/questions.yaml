  - id: Q-E-42
    pregunta: dame, por cada país, los tres comercios que más volumen liquidan, con el país, el nombre comercial y el volumen en euros
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "granos.lote_de_liquidacion"
    arbitrio: false
    por_que: >-
      `rank() OVER (PARTITION BY ...)`. Es el estrato que `PLAN.md` exige en 15 de los 60, y es donde un modelo suele intentar un `LIMIT` por grupo que no existe en SQL.
    sql_referencia: >-
      SELECT pais, trade_name, volumen FROM (SELECT m.country_code AS pais, m.trade_name, sum(s.gross_eur_minor)/100.0 AS volumen, rank() OVER (PARTITION BY m.country_code ORDER BY sum(s.gross_eur_minor) DESC) AS puesto FROM fact_settlement_batch s JOIN dim_merchant m ON m.merchant_id = s.merchant_id AND m.is_current GROUP BY m.country_code, m.trade_name) WHERE puesto <= 3 ORDER BY pais, puesto

  - id: Q-E-43
    pregunta: dame los diez comercios de más volumen, con su volumen en euros y su cuota en porcentaje sobre el total
    rol: analyst
    estrato: ventana_o_correlada
    glosario: "definiciones_criticas.ingreso"
    arbitrio: false
    por_que: >-
      `sum(...) OVER ()` sin partición: el total sobre el que se divide. Un modelo que lo resuelva con dos consultas y divida a mano da otro número si el `LIMIT` recorta antes.
    sql_referencia: >-
      SELECT trade_name, volumen, 100.0 * volumen / sum(volumen) OVER () AS cuota FROM (SELECT m.trade_name, sum(s.gross_eur_minor)/100.0 AS volumen FROM fact_settlement_batch s JOIN dim_merchant m ON m.merchant_id = s.merchant_id AND m.is_current GROUP BY m.trade_name) ORDER BY volumen DESC LIMIT 10

