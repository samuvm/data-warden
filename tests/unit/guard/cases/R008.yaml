rule_id: R008
nombre: "Rol, columna y POSICIÓN en el árbol"
familias:
  [columna_denegada, columna_enmascarada_en_predicado, expresion_derivada, alias_que_oculta, vista_que_reexpone]
por_que: >-
  Los tres niveles de la política NO son una escala de confianza: son una escala de
  POSICIÓN. Si puedes FILTRAR por una columna, la reconstruyes a base de preguntas
  aunque nunca veas su valor: el rango de fechas de nacimiento entre 1930 y 2010 son
  29.220 días, así que quince consultas con distinto literal fijan una fecha exacta.
accept:
  - id: R008-A1
    rol: analyst
    sql: "SELECT birth_date FROM dim_customer"
    por_que: >-
      `mask` en PROYECCIÓN DIRECTA es legal: la columna sale enmascarada. Aceptar
      esto es lo que hace usable el sistema; lo que se cierra es la posición.
  - id: R008-A2
    rol: analyst
    sql: "SELECT age_band, count(*) AS n FROM dim_customer WHERE age_band = '35-39' GROUP BY age_band"
    por_que: "La alternativa PUBLICADA de `birth_date`, en la posición prohibida para ella."
  - id: R008-A3
    rol: ops
    sql: "SELECT phone_e164 FROM dim_customer WHERE customer_id = 'CUS-1'"
    por_que: >-
      La asimetría que demuestra que la matriz no es una jerarquía: ops llama por
      teléfono todos los días y finance no llama a nadie nunca.
  - id: R008-A4
    rol: admin
    sql: "SELECT national_id, birth_date FROM dim_customer WHERE national_id = 'X'"
    por_que: >-
      Admin lo ve todo y sin enmascarar, a propósito: un DPO que no puede exportar
      el expediente completo no puede cumplir la ley. El control sobre él es el NO
      REPUDIO de la auditoría, no la máscara.
  - id: R008-A5
    rol: analyst
    sql: "SELECT email_domain, count(*) AS n FROM dim_customer GROUP BY email_domain"
    por_que: "El dominio del correo es lo que de verdad quería quien pidió los correos."
  # ---------------------------------------------------------------------------
  # Y el otro lado del arreglo del alias en ORDER BY: una columna PERMITIDA sigue
  # pudiendo ordenarse por su alias y por su ordinal. Sin estos dos casos, el
  # cierre de R008-R12/R13 podría hacerse rechazando todo alias sin tabla, que es
  # un guard que bloquea trabajo legítimo. Están aquí para que el arreglo no pueda
  # degenerar en eso sin que la suite se entere.
  # ---------------------------------------------------------------------------
  - id: R008-A6
    rol: analyst
    sql: "SELECT country_code AS c FROM dim_customer ORDER BY c LIMIT 5"
    por_que: "`country_code` es `allow`: ordenar por su alias es trabajo normal."
  - id: R008-A7
    rol: analyst
    sql: "SELECT country_code AS c FROM dim_customer ORDER BY 1 LIMIT 5"
    por_que: "Y por su ordinal, que `qualify` convierte en el mismo alias."

reject:
  - id: R008-R1
    rol: analyst
    sql: "SELECT customer_sk FROM dim_customer WHERE birth_date > '1990-01-01'"
    rule_id: R008
    code: column_policy
    posicion: where
    sujeto: "dim_customer.birth_date"
    reintentable: true
    por_que: "EL CANAL LATERAL POR PREDICADO. No devuelve la fecha y filtra por ella."
  - id: R008-R2
    rol: analyst
    sql: "SELECT national_id FROM dim_customer"
    rule_id: R008
    code: column_policy
    posicion: projection
    sujeto: "dim_customer.national_id"
    reintentable: true
    por_que: "`deny` está prohibida incluso en proyección directa."
  - id: R008-R3
    rol: analyst
    sql: "SELECT concat(first_name, ' ', last_name_1) AS nombre FROM dim_customer"
    rule_id: R008
    code: column_policy
    posicion: function_argument
    sujeto: "dim_customer.first_name"
    reintentable: true
    por_que: >-
      LA EXPRESIÓN DERIVADA que `PROJECT.md` describe. Dentro de una función es
      posición prohibida para una columna enmascarada, aunque la función esté en la
      proyección.
  - id: R008-R4
    rol: analyst
    sql: |
      WITH c AS (SELECT birth_date AS b, customer_sk FROM dim_customer)
      SELECT customer_sk FROM c WHERE b > '1990-01-01'
    rule_id: R008
    code: column_policy
    posicion: where
    sujeto: "dim_customer.birth_date"
    reintentable: true
    por_que: >-
      EL ALIAS QUE OCULTA. En el WHERE no pone `birth_date`, pone `b`. Lo encontró
      una prueba de humo, no una revisión, y obligó a resolver el linaje DENTRO de
      la consulta y no solo en el catálogo.
  - id: R008-R5
    rol: analyst
    sql: "SELECT customer_sk FROM v_customer WHERE full_name LIKE 'Juan%'"
    rule_id: R008
    code: column_policy
    posicion: where
    sujeto: "dim_customer.first_name"
    reintentable: true
    por_que: >-
      LA VISTA QUE REEXPONE. `v_customer.full_name` es `concat_ws` de tres columnas
      protegidas, servido por el propio catálogo.
  - id: R008-R6
    rol: finance
    sql: "SELECT customer_sk FROM dim_customer WHERE phone_e164 = '+34600000000'"
    rule_id: R008
    code: column_policy
    posicion: where
    sujeto: "dim_customer.phone_e164"
    reintentable: true
    por_que: "La otra mitad de la asimetría: finance no ve el teléfono en ninguna posición."
  - id: R008-R7
    rol: analyst
    sql: |
      SELECT count(*) AS n
      FROM dim_customer c
      JOIN dim_card k ON k.customer_sk = c.customer_sk AND c.birth_date > '1990-01-01'
    rule_id: R008
    code: column_policy
    posicion: join_on
    sujeto: "dim_customer.birth_date"
    reintentable: true
    por_que: "El mismo predicado, escondido en la condición de un JOIN."

  # ---------------------------------------------------------------------------
  # FAIL-CLOSED DEL LINAJE · `_reject_unknown`, la rama que hasta el 2026-09-02
  # NO TENÍA UN SOLO CASO. La mutación lo destapó: 22 de sus mutantes salían
  # marcados «sin tests», o sea que ningún test los EJECUTABA siquiera. Es la
  # rama que sostiene la mitad de `G-PII-LEAK`, así que era el agujero más serio
  # del guard entero, por encima del número de mutación.
  #
  # `guard/query_lineage.py:81` se rinde cuando el cuerpo de una CTE o de una
  # derivada NO es un `Select` —un `UNION`, un `INTERSECT`—, y devuelve `?`.
  # Rendirse es lo correcto; lo que importa es qué se hace después, y lo que se
  # hace es RECHAZAR: lo que no se puede afirmar seguro no se acepta.
  # ---------------------------------------------------------------------------
  - id: R008-R8
    rol: analyst
    sql: |
      WITH u AS (
        SELECT birth_date FROM dim_customer
        UNION ALL
        SELECT birth_date FROM dim_customer
      )
      SELECT birth_date FROM u
    rule_id: R008
    code: column_policy
    posicion: projection
    sujeto: "birth_date"
    reintentable: true
    por_que: >-
      Una CTE cuyo cuerpo es un UNION esconde el origen de la columna. Sin este
      rechazo, `birth_date` —que analyst solo puede ver enmascarada— saldría
      entera por una construcción que el linaje no sabe atravesar.
  - id: R008-R9
    rol: analyst
    sql: |
      SELECT birth_date
      FROM (
        SELECT birth_date FROM dim_customer
        UNION ALL
        SELECT birth_date FROM dim_customer
      ) AS u
    rule_id: R008
    code: column_policy
    posicion: projection
    sujeto: "birth_date"
    reintentable: true
    por_que: "La misma evasión sin CTE, con una tabla derivada. La forma más corta."
  - id: R008-R10
    rol: analyst
    sql: |
      SELECT b
      FROM (
        SELECT country_code AS b FROM dim_customer
        UNION
        SELECT country_code AS b FROM dim_customer
      ) AS u
    rule_id: R008
    code: column_policy
    posicion: projection
    sujeto: "b"
    reintentable: true
    por_que: >-
      **El caso que prueba que el fail-closed es de verdad.** `country_code` es
      `allow` para analyst: no hay nada que proteger. Y aun así se rechaza,
      porque la regla no es «esta columna es peligrosa» sino «no puedo AFIRMAR
      que esta columna sea segura». Un guard que solo se cerrara ante lo que ya
      sabe peligroso no serviría para lo que no ha visto nunca.
  - id: R008-R11
    rol: finance
    sql: |
      SELECT x.national_id
      FROM (
        SELECT national_id FROM dim_customer
        INTERSECT
        SELECT national_id FROM dim_customer
      ) AS x
    rule_id: R008
    code: column_policy
    posicion: projection
    sujeto: "national_id"
    reintentable: true
    por_que: "INTERSECT, para que la rama no dependa de que el operador sea UNION."

  # ---------------------------------------------------------------------------
  # REGRESIÓN · EXFILTRACIÓN POR ORDEN. Los tres se ACEPTABAN hasta el 2026-09-02.
  #
  # `qualify()` expande el alias de salida en `GROUP BY` y en `HAVING` —por eso
  # esos dos siempre se rechazaron— pero **no en `ORDER BY`**, donde deja una
  # columna sin tabla; y de paso convierte el ordinal en el alias, así que
  # `ORDER BY 1` acababa en el mismo sitio. `Scope.columns` de sqlglot excluye a
  # propósito esas referencias, el linaje nunca las indexaba, R008 preguntaba por
  # `.n`, no encontraba fila y aplicaba el `allow` por defecto.
  #
  # No era un rechazo perdido cualquiera: **`ORDER BY n LIMIT 1` con predicados
  # sobre columnas permitidas es una búsqueda binaria sobre un valor enmascarado.**
  # Se ordena, se mira el extremo, se acota, se repite. La política firmada lo
  # prohíbe con esas palabras: una columna «alcanzada a través de un alias».
  #
  # El rechazo nombra la columna BASE y no el alias, que es lo que permite
  # corregir la consulta: decir «no puedes usar `n`» no redirige a nadie.
  # ---------------------------------------------------------------------------
  - id: R008-R12
    rol: analyst
    sql: "SELECT first_name AS n FROM dim_customer ORDER BY n LIMIT 5"
    rule_id: R008
    code: column_policy
    posicion: order_by
    sujeto: "dim_customer.first_name"
    reintentable: true
    por_que: >-
      Ordenar por el alias de una columna enmascarada. Es el caso que estaba
      abierto y el que convierte el orden en un oráculo de comparación.
  - id: R008-R13
    rol: analyst
    sql: "SELECT first_name AS n FROM dim_customer ORDER BY 1 LIMIT 5"
    rule_id: R008
    code: column_policy
    posicion: order_by
    sujeto: "dim_customer.first_name"
    reintentable: true
    por_que: >-
      El mismo ataque por ordinal. `qualify` lo reescribe al alias, así que
      cerrarlo por el nombre del alias no habría bastado.
  - id: R008-R14
    rol: analyst
    sql: "SELECT first_name AS a FROM dim_customer ORDER BY a DESC LIMIT 1"
    rule_id: R008
    code: column_policy
    posicion: order_by
    sujeto: "dim_customer.first_name"
    reintentable: true
    por_que: >-
      `ORDER BY ... DESC LIMIT 1` es la forma más directa del oráculo: devuelve el
      extremo del recorrido en una sola consulta.
