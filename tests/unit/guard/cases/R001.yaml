rule_id: R001
nombre: "Una sola sentencia, y de lectura"
familias: [sentencia_no_consulta, sentencia_multiple, comando_de_motor]
por_que: >-
  `parse_one` habría devuelto la primera sentencia y descartado el resto EN
  SILENCIO. Ese es el camino por el que `SELECT 1; DROP TABLE x` pasa por un
  validador escrito con prisa. El validador de este proyecto llama a `parse`.
accept:
  - id: R001-A1
    rol: analyst
    sql: "SELECT customer_sk FROM dim_customer"
    por_que: "Una consulta. La forma normal."
  - id: R001-A2
    rol: analyst
    sql: "(SELECT customer_sk FROM dim_customer)"
    por_que: "Una consulta entre paréntesis sigue siendo una consulta."
  - id: R001-A3
    rol: analyst
    sql: |
      SELECT country_code FROM dim_customer
      UNION
      SELECT country_code FROM dim_merchant
    por_que: "Una operación de conjunto es una raíz de lectura legítima."
  - id: R001-A4
    rol: analyst
    sql: |
      WITH activos AS (SELECT customer_sk FROM dim_customer WHERE kyc_status = 'verified')
      SELECT customer_sk FROM activos
    por_que: "Un WITH con SELECT sigue teniendo una consulta en la raíz."
reject:
  - id: R001-R1
    rol: analyst
    sql: "PRAGMA database_list"
    rule_id: R001
    code: not_a_read_statement
    por_que: "Un PRAGMA no pregunta por datos: revela la configuración del motor."
  - id: R001-R2
    rol: analyst
    sql: "SET memory_limit = '1GB'"
    rule_id: R001
    code: not_a_read_statement
    por_que: "Cambia el estado del motor. No escribe datos, y aun así no se ejecuta."
  - id: R001-R3
    rol: analyst
    sql: "SELECT 1; SELECT 2"
    rule_id: R001
    code: unparseable_input
    por_que: >-
      DOS sentencias, las dos inofensivas. Se rechaza igual: si se aceptara el
      caso inofensivo, el mecanismo que para `SELECT 1; DROP TABLE x` no existiría.
  - id: R001-R4
    rol: analyst
    sql: "INSTALL httpfs"
    rule_id: R001
    code: not_a_read_statement
    por_que: "Cargar una extensión añade funciones que la allowlist nunca ha visto."
  - id: R001-R5
    rol: analyst
    sql: "SELECT FROM WHERE"
    rule_id: R001
    code: unparseable_input
    por_que: "Lo que no parsea no se ejecuta. Fail-closed también con la basura."
  - id: R001-R6
    rol: analyst
    sql: "x UNION SELECT 1"
    rule_id: R001
    code: not_a_read_statement
    por_que: >-
      **CASO PERMANENTE DE UN SIGSEGV.** Lo encontró la propiedad de fail-closed con
      5.000 entradas casi-SQL: la raíz es un `Union` legal, la rama izquierda no es
      una consulta, y al llegar a `qualify()` el `sqlglot[c]` compilado MATA EL
      PROCESO. Un segfault no lo atrapa ningún `except`: el guard no rechaza, muere.
      Se para antes de cualificar, comprobando lo que de todos modos es verdad.
  - id: R001-R7
    rol: admin
    sql: "1 EXCEPT SELECT 1"
    rule_id: R001
    code: not_a_read_statement
    por_que: "El mismo fallo con `EXCEPT` y con el rol más alto. Misma raíz, misma caída."
  - id: R001-R8
    rol: analyst
    sql: "SELECT 1 UNION ALL 2"
    rule_id: R001
    code: unparseable_input
    por_que: >-
      Y con la rama mala a la DERECHA, que es la que se olvida al arreglarlo. Aquí
      ni siquiera parsea, así que el rechazo llega antes y con otro `code`: se fija
      el que de verdad sale, porque un caso que asierta el código equivocado deja de
      detectar el día que la clasificación cambie.
