# CIERZO synthetic warehouse -- exploration shell.
#
#   docker compose -f datagen/docker/compose.yaml run --rm sql
#
# PROFILE picks which build to attach (dev | demo | full); it defaults to dev so
# that a first run is fast and cannot accidentally wait on a 3 GB build that does
# not exist yet.
services:
  sql:
    build:
      context: .
    image: cierzo-sql:1.5.5
    volumes:
      - ../out/${PROFILE:-dev}:/warehouse/data:ro
      - ../sql:/warehouse/sql:ro
      - ./catalog.sql:/etc/cierzo/catalog.sql:ro
      - ./init.sql:/etc/cierzo/init.sql:ro
    working_dir: /warehouse
    stdin_open: true
    tty: true
